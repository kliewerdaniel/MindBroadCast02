name: Brief Setup (Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install stack
        uses: ./.github/actions/install-stack

      - name: Test
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q

  deb:
    runs-on: ubuntu-latest
    needs: check
    # Only run on a version tag — a release, not every branch push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install fpm + deps
        run: |
          apt-get update -qq
          apt-get install -y -qq ruby-dev build-essential dpkg
          gem install --no-document fpm

      - name: Build .deb
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DEST"
          chmod +x packaging/release.sh
          ./packaging/release.sh "${VERSION#v}" "$DEST" > "$GITHUB_WORKSPACE/_release.log" 2>&1
          cat "$GITHUB_WORKSPACE/_release.log"
          ls -la "$DEST"
          # Fail closed: a release with no artifact must not go green.
          ls "$DEST"/*.deb > /dev/null || { echo "::error::no .deb produced"; exit 1; }

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: mindbroadcast-linux-deb
          # `with:` is not a shell context — $GITHUB_WORKSPACE would be taken
          # literally here and match nothing. Use the expression instead.
          path: "${{ github.workspace }}/dist/*.deb"
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ github.workspace }}/dist/*.deb"
          generate_release_notes: true
