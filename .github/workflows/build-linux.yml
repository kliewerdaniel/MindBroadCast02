name: Brief Setup (Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install stack
        uses: ./.github/actions/install-stack

      - name: Test
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q

  deb:
    runs-on: ubuntu-latest
    needs: check
    # Optional: only run on a tag, or always for a snapshot.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install fpm + deps
        run: |
          apt-get update -qq
          apt-get install -y -qq ruby-dev build-essential dpkg
          gem install --no-document fpm

      - name: Build .deb
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DEST"
          ./packaging/release.sh "$VERSION" "$DEST" > "$GITHUB_WORKSPACE/_release.log" 2>&1
          cat "$GITHUB_WORKSPACE/_release.log"
          ls -la "$DEST"
          cp "$GITHUB_WORKSPACE/_release.log" "$GITHUB_WORKSPACE/release-check.log"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: mindbroadcast_${{ github.ref_name }}_amd64.deb
          path: "$GITHUB_WORKSPACE/dist"
          if-no-files-found: ignore
