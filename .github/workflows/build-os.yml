name: Brief Setup (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Base CI check (zero-dependency job required by GitHub for workflow validation) ──
  # This job has no needs, so it always runs and keeps the workflow valid on
  # a plain `push`/`pull_request` (before any tag-gated release job runs).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install stack
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet -r requirements.txt

      - name: Test (compile + unit + integration)
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q

  # ── Linux .deb (fpm) ──────────────────────────────────────────────────
  # Runs on Linux, but we want the .deb from this repo, not from the host.
  # We run the release script inside a fpm container on a Linux runner.
  deb:
    runs-on: ubuntu-latest
    needs: check
    # Only run when a tag is pushed (a release). Keep it out of every CI run
    # so a clean master build stays fast. Trigger on push to a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain + fpm
        run: |
          apt-get update -qq
          apt-get install -y -qq ruby-dev build-essential dpkg
          gem install --no-document fpm

      - name: Build .deb + log
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DEST"
          ./packaging/release.sh "$VERSION" "$DEST" > "$GITHUB_WORKSPACE/_release.log" 2>&1
          cat "$GITHUB_WORKSPACE/_release.log"
          cp "$GITHUB_WORKSPACE/_release.log" "$GITHUB_WORKSPACE/release-check.log"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindbroadcast_${{ github.ref_name }}_amd64.deb
          path: "$GITHUB_WORKSPACE/dist"
          if-no-files-found: ignore

  # ── Windows .exe (PyInstaller on Windows) ─────────────────────────────
  # The first time this workflow runs it has no artifacts to attach, so we do
  # the actual building here on a Windows runner and upload the .exe.
  windows-exe:
    runs-on: windows-latest
    needs: check
    # Only build the .exe on a tag push. On a plain branch push, we still want
    # the CI green; the .exe is built when the user votes for it on Windows.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller + console deps
        run: |
          python -m venv .venv
          .\.venv\Scripts\activate
          pip install --quiet pyinstaller

      - name: Build Windows .exe
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          ./packaging/release.sh "$VERSION" "$GITHUB_WORKSPACE/dist" > "$GITHUB_WORKSPACE/_release.log" 2>&1
          cat "$GITHUB_WORKSPACE/_release.log"
          cp "$GITHUB_WORKSPACE/_release.log" "$GITHUB_WORKSPACE/release-check.log"

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v4
        with:
          name: MindBroadcast-${{ github.ref_name }}-win-x86_64.exe
          path: "$GITHUB_WORKSPACE/dist/MindBroadcast-${{ github.ref_name }}-win-x86_64.exe"
          if-no-files-found: ignore
