name: Brief Setup (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Zero-dependency base job: GitHub rejects a workflow whose every job has
  # `needs`, so this always runs and keeps the file valid on a branch push.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install stack
        uses: ./.github/actions/install-stack

      - name: Test (compile + unit + integration)
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q

  # ── Windows .exe (PyInstaller on Windows) ─────────────────────────────
  # PyInstaller cannot cross-compile, so the .exe is built on a Windows
  # runner. The Linux .deb lives in build-linux.yml — one builder per OS, so
  # two jobs never race to publish the same artifact.
  windows-exe:
    runs-on: windows-latest
    needs: check
    # Only build on a version tag — a release, not every branch push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller + runtime deps
        run: |
          python -m venv .venv
          .\.venv\Scripts\activate
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt pyinstaller

      - name: Build Windows .exe
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          chmod +x packaging/release.sh
          ./packaging/release.sh "${VERSION#v}" "$GITHUB_WORKSPACE/dist" > "$GITHUB_WORKSPACE/_release.log" 2>&1
          cat "$GITHUB_WORKSPACE/_release.log"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v4
        with:
          name: mindbroadcast-windows-exe
          path: "${{ github.workspace }}/dist/*.exe"
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ github.workspace }}/dist/*.exe"
          generate_release_notes: true
