name: Brief Setup (macOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Zero-dependency base job: GitHub rejects a workflow whose every job has
  # `needs`, so this always runs and keeps the file valid on a branch push.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install stack
        uses: ./.github/actions/install-stack

      - name: Test
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q

  dmg:
    runs-on: macos-latest
    needs: check
    # Only build on a version tag — a release, not every branch push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt pyinstaller
          # release.sh probes `command -v pyinstaller`, so the venv must be on
          # PATH for the build step too (each step is a fresh shell).
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build .dmg
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x packaging/release.sh
          ./packaging/release.sh "${VERSION#v}" "$GITHUB_WORKSPACE/dist"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Smoke-test the frozen binary
        run: |
          set -euo pipefail
          DMG=$(ls "$GITHUB_WORKSPACE"/dist/*.dmg | head -1)
          MP=$(hdiutil attach "$DMG" -nobrowse -readonly | grep Volumes | awk '{print $3}')
          BIN=$(find "$MP" -type f -path "*/MacOS/*" | head -1)
          cp "$BIN" /tmp/mb-smoke
          hdiutil detach "$MP" >/dev/null
          chmod +x /tmp/mb-smoke
          SOVEREIGN_ALLOW_EXTERNAL_INFERENCE=0 /tmp/mb-smoke > /tmp/smoke.log 2>&1 &
          UP=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 http://127.0.0.1:7862/api/health >/dev/null; then
              echo "console responded after ${i} attempt(s)"; UP=1; break
            fi
            sleep 2
          done
          if [ "$UP" != "1" ]; then
            echo "::error::frozen console never became reachable"
            echo "--- /tmp/smoke.log ---"; cat /tmp/smoke.log
            pkill -f mb-smoke || true
            exit 1
          fi
          curl -sf --max-time 5 http://127.0.0.1:7862/ | head -c 200
          echo
          curl -s -o /dev/null -w "styles.css HTTP %{http_code}\n" --max-time 5 http://127.0.0.1:7862/static/styles.css
          pkill -f mb-smoke || true

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindbroadcast-macos-dmg
          path: "${{ github.workspace }}/dist/*.dmg"
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ github.workspace }}/dist/*.dmg"
          generate_release_notes: true
