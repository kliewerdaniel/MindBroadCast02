name: Brief Setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install stack
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet -r requirements.txt
          # Pass 2 (entity extraction) needs the spaCy model data. A bare
          # `pip install spacy` does not include it, and `spacy download` puts
          # the model in a global cache that a fresh venv cannot see. Install
          # the model package into the venv so `spacy.load()` can find it.
          pip install --quiet --no-cache-dir \
            "en-core-web-sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Lint (compile)
        run: |
          . .venv/bin/activate
          python -m py_compile $(git ls-files '*.py') || true

      - name: Test
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q
