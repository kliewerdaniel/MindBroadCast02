[pytest]
asyncio_mode = auto
testpaths = tests
# Upstream deprecation noise we cannot fix here, which otherwise obscures real
# warnings in the suite output: feedparser's `updated` -> `published` fallback,
# and spacy's urllib3/OpenSSL notice on this macOS Python.
filterwarnings =
    ignore::DeprecationWarning:feedparser.*
    ignore::Warning:urllib3.*
